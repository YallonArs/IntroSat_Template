; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = release

[env:release]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_src_filter = +<*.cpp> -<x__*.cpp> -<examples/*>
build_flags = -std=c++17
build_unflags = -std=c++11
build_type = debug
lib_deps = 
	arduino-libraries/SD@^1.3.0
	https://github.com/bitbank2/JPEGENC
	http://github.com/obu-IntroSat/IntroSatLib
	https://github.com/GyverLibs/GyverPID
	mfurga/CC1101@^1.2.0

; upload_flags = -c set CPUTAPID 0x2ba01477

[env:i2c_scanner]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_src_filter = -<*.cpp> +<examples/i2c_scanner.cpp>
; upload_flags = -c set CPUTAPID 0x2ba01477
