; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = release

[env:release]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_src_filter = +<*.cpp> -<x__*.cpp> -<examples/*>
build_flags = -std=c++20
build_unflags = -std=c++11
build_type = debug
lib_deps = 
	arduino-libraries/SD@^1.3.0
	https://github.com/bitbank2/JPEGENC
	http://github.com/obu-IntroSat/IntroSatLib
	https://github.com/GyverLibs/GyverPID
	mfurga/CC1101@^1.2.0
	mikalhart/TinyGPSPlus@^1.1.0
	laurb9/StepperDriver@^1.4.1

[env:i2c_scanner]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_src_filter = -<*.cpp> +<examples/i2c_scanner.cpp>
